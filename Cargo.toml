[workspace]
members = ["crates/app", "crates/core", "crates/relay", "xtask"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8"
gpui-kit = "=0.9.0"
loregalia-core = { path = "crates/core" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = "1"
ureq = "3.5"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
panic = "abort"
strip = true
