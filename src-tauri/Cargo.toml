[package]
edition = "2024"
version = "0.1.0"
name = "Loregalia"
authors = ["Manuel Soler Juan"]
# TODO: Write an apt description of the app
description = ""

[lib]
name = "loregalia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri-plugin-opener = "2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }


[profile.release]
lto = true
strip = true
# ! Change to '3' if too slow
opt-level = "s"
panic = "abort"
codegen-units = 1

[profile.dev]
incremental = true